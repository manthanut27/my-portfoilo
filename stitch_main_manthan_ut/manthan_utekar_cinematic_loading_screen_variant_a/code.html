<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manthan Utekar - Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;family=Inter:wght@400;500&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        fizzi: {
                            yellow: "#FDE047",
                            orange: "#FE6334",
                            navy: "#0c4a6e",
                            lime: "#D9F99D",
                            cyan: "#C0F0F5",
                            pink: "#FFA6B5",
                            lavender: "#E9CFF6",
                            green: "#CBEF9A",
                            grape: "#572981",
                            cherry: "#710523",
                            dark: "#0d1117"
                        }
                    },
                    fontFamily: {
                        headline: ["Syne", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                        mono: ["Space Mono", "monospace"]
                    },
                    backgroundImage: {
                        'dot-pattern': 'radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px)'
                    },
                    backgroundSize: {
                        'dot-size': '20px 20px'
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'progress': 'progress 3s ease-out forwards',
                        'fade-in': 'fadeIn 1s ease-out forwards',
                        'slide-up': 'slideUp 1s ease-out forwards'
                    },
                    keyframes: {
                        glow: {
                            '0%': { opacity: 0.8, textShadow: '0 0 10px rgba(255,255,255,0.2)' },
                            '100%': { opacity: 1, textShadow: '0 0 20px rgba(255,255,255,0.8)' }
                        },
                        progress: {
                            '0%': { width: '0%' },
                            '100%': { width: '65%' }
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: 0 },
                            '100%': { transform: 'translateY(0)', opacity: 1 }
                        }
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0d1117;
            color: white;
            overflow: hidden; /* Prevent scrolling during loading */
        }
        
        .kanji-bg {
            font-family: 'Noto Sans JP', sans-serif; /* Fallback for Kanji */
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col items-center justify-center bg-fizzi-dark bg-dot-pattern bg-dot-size selection:bg-fizzi-orange selection:text-white">
<!-- Cinematic Background Glow Effect -->
<div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
<div class="w-[80vw] h-[409px] bg-fizzi-orange/5 rounded-full blur-[100px] animate-pulse"></div>
</div>
<!-- Ghosted Kanji Layer -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none overflow-hidden opacity-5">
<div class="text-[30vw] leading-none font-bold kanji-bg tracking-tighter mix-blend-overlay">
            創造
        </div>
<div class="text-[30vw] leading-none font-bold kanji-bg tracking-tighter mix-blend-overlay -mt-[10vw]">
            構築
        </div>
</div>
<!-- Main Content Container -->
<div class="relative z-20 flex flex-col items-center text-center space-y-6 px-4">
<!-- Large Display Text -->
<h1 class="font-headline font-extrabold text-5xl md:text-7xl lg:text-9xl tracking-[0.2em] md:tracking-[0.3em] uppercase animate-glow transition-all duration-700">
            MANTHAN<br class="md:hidden"/> UTEKAR
        </h1>
<!-- Tagline -->
<p class="font-mono font-bold text-fizzi-orange text-lg md:text-2xl tracking-[0.4em] uppercase animate-slide-up animation-delay-300">
            BUILD. SHIP. REPEAT.
        </p>
<!-- Decorative subtle element -->
<div class="w-12 h-[2px] bg-white/20 mt-8 animate-fade-in animation-delay-500"></div>
</div>
<!-- Progress Bar Footer -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-white/10 z-30">
<div class="h-full bg-fizzi-orange animate-progress shadow-[0_0_10px_#FE6334]"></div>
</div>
<!-- Micro-interaction script (simulated loading) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Add subtle mouse parallax effect for cinematic feel
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                
                const title = document.querySelector('h1');
                if(title) {
                    title.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
                }
                
                const kanji = document.querySelectorAll('.kanji-bg');
                kanji.forEach(k => {
                   k.style.transform = `translate(${xAxis * -1.5}px, ${yAxis * -1.5}px)`; 
                });
            });
        });
    </script>
</body></html>
