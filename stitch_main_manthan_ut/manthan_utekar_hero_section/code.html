<div class="w-[450px] h-[450px] rounded-full border-[3px] border-dashed border-brand-navy/20 animate-spin-slow"></div>
</div>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">

<!-- Scroll Indicator -->
<div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center space-y-2 opacity-80 hover:opacity-100 transition-opacity">
<span class="text-[10px] font-label font-bold text-brand-navy uppercase tracking-[0.2em] rotate-90 mb-6">SCROLL</span>
<div class="w-[2px] h-12 bg-brand-navy/20 relative overflow-hidden rounded-full">
<div class="absolute top-0 left-0 w-full h-full bg-brand-orange animate-scroll-indicator"></div>
</div>

</main>
<script>
        // Scroll Progress
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('scroll-progress').style.width = scrolled + '%';
        });

        // Typewriter Effect
        const textToType = "Full-Stack Developer · React · Node.js · Supabase";
        const typewriterElement = document.getElementById('typewriter-text');
        let i = 0;
        
        function typeWriter() {
            if (i < textToType.length) {
                typewriterElement.innerHTML += textToType.charAt(i);
                i++;
                setTimeout(typeWriter, 50);
            }
        }
        
        // Start typing after a short delay
        setTimeout(typeWriter, 500);

        // Interactive 3D tilt effect on hero graphic
        const graphicContainer = document.querySelector('.hero-graphic-container');
        const graphic = document.getElementById('hero-graphic');

        graphicContainer.addEventListener('mousemove', (e) => {
            const rect = graphicContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -15; // Max 15deg rotation
            const rotateY = ((x - centerX) / centerX) * 15;
            
            graphic.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
        });

        graphicContainer.addEventListener('mouseleave', () => {
            graphic.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
        });
        
        // Simple counter updater (visual only for effect)
        setInterval(() => {
            const counterEl = document.getElementById('uptime-counter');
            let text = counterEl.innerText;
            // Just a visual tick effect on the seconds digit if we wanted, but static is fine based on prompt.
        }, 1000);
    </script>
