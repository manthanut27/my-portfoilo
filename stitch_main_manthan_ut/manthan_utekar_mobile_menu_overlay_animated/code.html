<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mobile Hamburger Overlay Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Public+Sans:wght@400;800;900&amp;family=Space+Mono&amp;family=Syne:wght@800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "fizzi-yellow": "#FDE047",
                        "orange-red": "#FE6334",
                        "navy": "#0c4a6e",
                        "lime": "#D9F99D",
                        "cyan": "#C0F0F5",
                        "pink": "#FFA6B5",
                        "lavender": "#E9CFF6",
                        "green": "#CBEF9A",
                        "grape": "#572981",
                        "cherry": "#710523"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Syne", "sans-serif"],
                        "display": ["Public Sans", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Space Mono", "monospace"]
                    }
                }
            }
        }
    </script>
<style>
        .stagger-item {
            opacity: 0;
            transform: translateY(20px);
            animation: fade-in-up 0.5s ease forwards;
        }
        
        @keyframes fade-in-up {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            opacity: 0;
            animation: fade-in 0.3s ease forwards;
        }

        @keyframes fade-in {
            to {
                opacity: 1;
            }
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-600 { animation-delay: 600ms; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-fizzi-yellow antialiased text-navy h-screen w-full relative overflow-hidden flex items-center justify-center">
<!-- Mock Background Content to show overlay -->
<div class="text-center p-8">
<h1 class="font-headline text-5xl mb-4">Background Content</h1>
<p class="font-body text-lg">Clicking the mock menu button below would open the overlay in a real app.</p>
<button class="mt-8 px-6 py-3 bg-navy text-white rounded-full font-label hover:bg-orange-red transition-colors flex items-center gap-2 mx-auto" id="openMenu">
<span class="material-symbols-outlined">menu</span>
            Open Overlay Menu
        </button>
</div>
<!-- Mobile Overlay Menu -->
<div class="fixed inset-0 bg-navy z-[100] flex flex-col transition-opacity duration-300 opacity-100" id="mobileMenu">
<!-- Header -->
<header class="flex justify-end p-6">
<button aria-label="Close menu" class="fade-in text-white hover:text-orange-red transition-colors p-2" id="closeMenu">
<span class="material-symbols-outlined text-4xl" data-weight="fill">close</span>
</button>
</header>
<!-- Main Navigation Links -->
<nav class="flex-1 flex flex-col items-center justify-center gap-8">
<a class="stagger-item delay-100 text-white font-headline text-5xl sm:text-6xl md:text-7xl hover:text-orange-red hover:scale-105 transition-all duration-300" href="#about">About</a>
<a class="stagger-item delay-200 text-white font-headline text-5xl sm:text-6xl md:text-7xl hover:text-orange-red hover:scale-105 transition-all duration-300" href="#skills">Skills</a>
<a class="stagger-item delay-300 text-white font-headline text-5xl sm:text-6xl md:text-7xl hover:text-orange-red hover:scale-105 transition-all duration-300" href="#projects">Projects</a>
<a class="stagger-item delay-400 text-white font-headline text-5xl sm:text-6xl md:text-7xl hover:text-orange-red hover:scale-105 transition-all duration-300" href="#terminal">Terminal</a>
<a class="stagger-item delay-500 text-white font-headline text-5xl sm:text-6xl md:text-7xl hover:text-orange-red hover:scale-105 transition-all duration-300" href="#contact">Contact</a>
</nav>
<!-- Bottom Action -->
<div class="p-8 pb-12 flex justify-center stagger-item delay-600">
<a class="bg-orange-red text-white font-body font-bold text-xl px-12 py-4 rounded-full hover:scale-105 transition-transform duration-300 shadow-lg shadow-orange-red/20 inline-flex items-center gap-2" href="#">
                RESUME
                <span class="material-symbols-outlined">download</span>
</a>
</div>
</div>
<script>
        // Simple interaction for demo purposes
        const menu = document.getElementById('mobileMenu');
        const openBtn = document.getElementById('openMenu');
        const closeBtn = document.getElementById('closeMenu');

        closeBtn.addEventListener('click', () => {
            menu.style.opacity = '0';
            setTimeout(() => {
                menu.style.pointerEvents = 'none';
            }, 300);
        });

        openBtn.addEventListener('click', () => {
            menu.style.pointerEvents = 'auto';
            menu.style.opacity = '1';
            
            // Retrigger animations
            const items = menu.querySelectorAll('.stagger-item, .fade-in');
            items.forEach(item => {
                item.style.animation = 'none';
                item.offsetHeight; /* trigger reflow */
                item.style.animation = null; 
            });
        });
    </script>
</body></html>
