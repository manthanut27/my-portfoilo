<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Concentric Rings -->
  <circle cx="200" cy="200" r="180" stroke="#0c4a6e" stroke-width="1" stroke-dasharray="10 10" class="ring-outer" />
  <circle cx="200" cy="200" r="140" stroke="#0c4a6e" stroke-width="2" class="ring-middle" />
  <circle cx="200" cy="200" r="100" stroke="#0c4a6e" stroke-width="1" class="ring-inner" />
  
  <!-- Central Monogram -->
  <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" font-family="Syne, sans-serif" font-weight="800" font-size="80" fill="#0c4a6e">MU</text>
  
  <!-- Blobs -->
  <circle cx="80" cy="120" r="30" fill="#FFA6B5" fill-opacity="0.6" />
  <circle cx="320" cy="100" r="40" fill="#E9CFF6" fill-opacity="0.6" />
  <circle cx="300" cy="300" r="35" fill="#C0F0F5" fill-opacity="0.6" />
  
  <!-- Accent Dots -->
  <circle cx="150" cy="80" r="5" fill="#572981" />
  <circle cx="250" cy="340" r="4" fill="#710523" />
  <circle cx="50" cy="250" r="6" fill="#FE6334" />
</svg>
